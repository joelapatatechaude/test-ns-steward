apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: steward-postgres
  namespace: openshift-gitops
spec:
  project: steward
  source:
    repoURL: https://github.com/joelapatatechaude/test-ns-steward.git
    targetRevision: HEAD
    path: steward-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: steward-postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
