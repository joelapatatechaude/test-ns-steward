apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-bootstrap
  namespace: openshift-gitops
spec:
  project: cluster-bootstrap
  source:
    repoURL: https://github.com/joelapatatechaude/test-ns-steward.git
    targetRevision: HEAD
    path: cluster/bootstrap
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
